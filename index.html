<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimmy's iPhone 17 Pro Max</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    /* Bingkai iPhone 17 Pro Max */
    .phone-frame {
      width: 360px;
      height: 730px;
      background-color: #000;
      border: 10px solid #2b2b2b;
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }
    
    /* Dynamic Island iOS Style */
    .dynamic-island {
      width: 110px; height: 28px; background-color: #000;
      margin: 8px auto 0; border-radius: 20px; z-index: 100;
      position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
    }

    /* Status Bar */
    .status-bar {
      width: 100%; height: 40px; display: flex; justify-content: space-between;
      align-items: center; padding: 0 25px; font-size: 12px; font-weight: 600; z-index: 90;
    }
    
    /* Screen Global */
    .screen { flex: 1; position: relative; background: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600') center/cover; overflow: hidden; display: flex; flex-direction: column; }

    /* 1. LOCKSCREEN */
    #lockscreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 60px 20px 40px; z-index: 70; transition: transform 0.5s cubic-bezier(0.1, 1, 0.1, 1);
    }
    .lock-time { font-size: 64px; font-weight: 200; text-shadow: 0 2px 10px rgba(0,0,0,0.4); letter-spacing: -2px; }
    .lock-date { font-size: 15px; font-weight: 500; opacity: 0.9; margin-top: -10px; }
    
    .passcode-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .pass-dots { display: flex; gap: 12px; }
    .dot { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; background: transparent; transition: 0.2s; }
    .dot.active { background: #fff; }
    
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 240px; }
    .num-btn {
      width: 65px; height: 65px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
      border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px;
      font-weight: 500; cursor: pointer; user-select: none; margin: 0 auto; border: none; color: #fff;
    }
    .num-btn:active { background: rgba(255, 255, 255, 0.4); }
    .error-msg { font-size: 12px; color: #ff6b6b; height: 15px; font-weight: 600; }

    /* HOMESCREEN */
    .homescreen { flex: 1; padding: 25px 20px; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; }
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; }
    .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .icon-box {
      width: 60px; height: 60px; border-radius: 14px; display: flex;
      justify-content: center; align-items: center; font-size: 28px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .app-name { font-size: 11px; margin-top: 6px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); font-weight: 500; }

    /* iOS Dock */
    .ios-dock {
      background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(25px);
      border-radius: 30px; padding: 12px 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.25);
    }

    /* APLIKASI (MODAL FULLSCREEN) */
    .app-window {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000; z-index: 60; display: none; flex-direction: column;
    }
    .app-header {
      padding: 45px 15px 12px; background: #121212; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; border-bottom: 1px solid #222;
    }
    .back-btn { cursor: pointer; font-size: 16px; color: #0a84ff; display: flex; align-items: center; gap: 4px; }

    /* GALERI FOTO */
    .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; overflow-y: auto; background: #000; flex: 1; }
    .gallery-item {
      width: 100%; height: 150px; border-radius: 12px; object-fit: cover;
      cursor: pointer; border: 1px solid #222;
    }

    /* WHATSAPP iOS STYLE */
    .wa-header { background-color: #1f1f1f; color: #fff; border-bottom: 1px solid #333; }
    .chat-body { flex: 1; background: #0b141a; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .chat-bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4; position: relative;
    }
    .chat-in { background-color: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 4px; }
    .chat-out { background-color: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 4px; }
    .sender-name { font-size: 11px; font-weight: bold; color: #ff5722; margin-bottom: 3px; }
    .chat-time { font-size: 9px; color: rgba(255,255,255,0.5); text-align: right; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="dynamic-island"></div>
    
    <div class="screen">
      <!-- iOS Status Bar -->
      <div class="status-bar">
        <span id="current-time-bar">19:30</span>
        <span>5G 🔋</span>
      </div>

      <!-- 1. LOCKSCREEN DENGAN PIN 080310 -->
      <div id="lockscreen">
        <div style="text-align: center;">
          <div class="lock-time" id="clock">19:30</div>
          <div class="lock-date">Kamis, 22 Oktober</div>
        </div>
        
        <div class="passcode-container">
          <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.5px;">Masukkan Sandi (080310)</div>
          <div class="pass-dots">
            <div class="dot" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
            <div class="dot" id="d4"></div>
            <div class="dot" id="d5"></div>
